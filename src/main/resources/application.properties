spring.application.name=spring-shopping-cart
server.port=${PORT:8080}

# Default to dev locally if no profile is specified
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Third-Party Services & Secrets (Injected via .env locally or Render Env Vars in prod)
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${API_KEY}
cloudinary.api_secret=${API_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.secretKey=${VNPAY_SECRET_KEY}

payos.clientId=${PAYOS_CLIENT_ID}
payos.apiKey=${PAYOS_API_KEY}
payos.checksumKey=${PAYOS_CHECKSUM_KEY}

gg.identity.clientId=${GG_CLIENT_ID}
gg.identity.clientSecret=${GG_CLIENT_SECRET}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/shop/api-docs
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

rate-limit.enabled=true
rate-limit.capacity=100
rate-limit.refill-tokens=100
rate-limit.refill-period-seconds=60