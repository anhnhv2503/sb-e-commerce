spring.datasource.url=${DEPLOY_DB}
spring.datasource.username=${DEPLOY_DB_USERNAME}
spring.datasource.password=${DEPLOY_DB_PASSWORD}

# Free-Tier HikariCP Pool Limits (prevents exceeding TiDB connection caps)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000

# Disable SQL console spam in production to save CPU/RAM
spring.jpa.properties.hibernate.show_sql=false

client.domain=https://demo-va-shop.vercel.app/
gg.identity.redirectUri=https://demo-va-shop.vercel.app/auth